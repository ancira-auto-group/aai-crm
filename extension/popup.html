<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAI CRM Extension</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: white;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .info-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .info-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .info-card p {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #374151;
      margin-top: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .status-dot.inactive {
      background: #ef4444;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      font-family: inherit;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
      margin-bottom: 8px;
    }

    .btn:hover {
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: white;
      color: #374151;
      border: 1px solid #e5e7eb;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #f9fafb;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
    }

    .stat-label {
      font-size: 12px;
      color: #6b7280;
    }

    .shortcut-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #374151;
      margin-top: 6px;
    }

    kbd {
      font-family: inherit;
      font-size: 12px;
      background: white;
      border: 1px solid #d1d5db;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      color: #111827;
    }

    .link-btn {
      background: none;
      border: none;
      padding: 0;
      margin-top: 10px;
      color: #667eea;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .store-picker {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
    }

    .store-picker select {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
    }

    [hidden] {
      display: none !important;
    }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AAI CRM Extension</h1>
    <p>Text Enhancement Assistant</p>
  </div>

  <div class="content">
    <div class="info-card">
      <h3>How to Use</h3>
      <p>Select text (10+ characters) on VinSolutions CRM pages to see the enhancement button.</p>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Checking configuration...</span>
      </div>
      <label class="store-picker" id="storePicker" hidden>
        <span>Current store</span>
        <select id="currentStore"></select>
      </label>
    </div>

    <div class="info-card">
      <h3>This Month</h3>
      <div class="stats">
        <div>
          <div class="stat-value" id="monthRequests">0</div>
          <div class="stat-label">requests</div>
        </div>
        <div>
          <div class="stat-value" id="monthCost">$0.00</div>
          <div class="stat-label">estimated cost</div>
        </div>
      </div>
    </div>

    <div class="info-card">
      <h3>Keyboard Shortcuts</h3>
      <div class="shortcut-row"><span>Enhance selection</span><kbd id="shortcutEnhance">Not set</kbd></div>
      <div class="shortcut-row"><span>Reply to selection</span><kbd id="shortcutResponse">Not set</kbd></div>
      <button class="link-btn" id="editShortcuts">Change shortcuts</button>
    </div>

    <button class="btn" id="openSettings">Open Settings</button>
  </div>

  <div class="footer" id="versionText"></div>

  <script src="popup.js"></script>
</body>
</html>
