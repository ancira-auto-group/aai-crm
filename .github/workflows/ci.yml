name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Version numbers match
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi

      - name: Extension scripts parse
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("extension/manifest.json"))'
          for f in extension/*.js; do node --check "$f"; done

      - name: Server builds
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Package extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd extension
          zip -r "../aai-crm-extension-${GITHUB_REF_NAME}.zip" . -x 'test-page.html'

      - name: Upload extension package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: aai-crm-extension-${{ github.ref_name }}
          path: aai-crm-extension-${{ github.ref_name }}.zip

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aai_test
      DATABASE_DRIVER: pg
      OPENAI_API_KEY: sk-test
      OPENAI_BASE_URL: http://127.0.0.1:4010/v1
      MIN_EXTENSION_VERSION: 3.0.0
      TEST_DATABASE: '1'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Set up the test database
        run: npm run migrate

      - name: Start the mock OpenAI and the server
        run: |
          node test/mock-openai.mjs > mock.log 2>&1 &
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/admin && break; sleep 1; done

      - name: API tests
        run: npm test

      - name: Server log (on failure)
        if: failure()
        run: tail -100 server.log
